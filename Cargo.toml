[package]
name = "server-pet"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A persistent virtual pet that lives in your Discord server."

[dependencies]
serenity = { version = "0.12.5", default-features = false, features = [
    "client",
    "gateway",
    "rustls_backend",
    "model",
    "builder",
    "cache",
] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
tiny-skia = "0.11"
ab_glyph = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
serde_json = "1"
