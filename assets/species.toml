# Adoptable species.
#
# Each entry needs a unique `key` made of letters, digits, underscores and
# hyphens. The key is also the art folder name: art for `key = "cat"` lives in
# `assets/pets/cat/`, with one PNG per mood.
#
# `favourite_food` matches the choices on /feed  : snack, meal, treat, greens
# `favourite_game` matches the choices on /play  : fetch, puzzle, dance
#
# Discord allows at most 25 choices on a slash command option, so at most 25
# species. Changes take effect on the next restart.

[[species]]
key = "dog"
name = "Dog"
emoji = "🐶"
description = "Golden coat, floppy ears, red bandana. Delighted by everyone."
favourite_food = "meal"
favourite_game = "fetch"

[[species]]
key = "cat"
name = "Cat"
emoji = "🐱"
description = "Orange tabby in a teal scarf. Tolerates the server. Barely."
favourite_food = "treat"
favourite_game = "puzzle"

[[species]]
key = "dragon"
name = "Dragon"
emoji = "🐉"
description = "Jade scales and golden horns. Small now. Will not stay small."
favourite_food = "meal"
favourite_game = "dance"

[[species]]
key = "mouse"
name = "Mouse"
emoji = "🐭"
description = "Lavender fur, big pink ears, purple scarf. Small but bold."
favourite_food = "snack"
favourite_game = "puzzle"
